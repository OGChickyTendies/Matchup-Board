# Temporary: checks whether ESPN's public feeds list game-day inactives. Delete after use.
name: Probe inactives
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
              return json.load(r)
          for ev in ("401873007", "401873008", "401873005"):
              c = get(f"https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/{ev}/competitions/{ev}/competitors")
              for it in c["items"]:
                  comp = get(it["$ref"]); ro = get(comp["roster"]["$ref"])
                  team = get(comp["team"]["$ref"])["abbreviation"]
                  dnp = []
                  for e in ro["entries"]:
                      if e.get("didNotPlay"):
                          a = get(e["athlete"]["$ref"])
                          dnp.append(f'{a.get("fullName")} ({a.get("position",{}).get("abbreviation")})')
                  print(ev, team, len(ro["entries"]), "didNotPlay:", "; ".join(dnp))
          PY
