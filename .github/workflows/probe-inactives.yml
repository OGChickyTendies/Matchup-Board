# Temporary: watches when ESPN's feeds show Thursday's inactives (NE @ CHI, Oct 22, kickoff 00:15 UTC Fri).
# Delete after the Oct 22 game.
name: Probe inactives
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 22-23 * * 4"
    - cron: "0-40/10 0 * * 5"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
              return json.load(r)
          ev = "401873010"
          print("now", datetime.datetime.utcnow().isoformat())
          try:
              c = get(f"https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/{ev}/competitions/{ev}/competitors")
              for it in c["items"]:
                  comp = get(it["$ref"])
                  team = get(comp["team"]["$ref"])["abbreviation"]
                  ref = (comp.get("roster") or {}).get("$ref")
                  if not ref:
                      print(team, "roster: not posted"); continue
                  ro = get(ref); ents = ro.get("entries", [])
                  flag = lambda k: sum(1 for e in ents if e.get(k))
                  names = lambda k: [e.get("displayName") for e in ents if e.get(k)]
                  print(team, "roster entries", len(ents), "active", flag("active"), "didNotPlay", flag("didNotPlay"), "starter", flag("starter"))
                  print("  didNotPlay:", names("didNotPlay"))
                  print("  not active:", [e.get("displayName") for e in ents if e.get("active") is False][:70])
          except Exception as e: print("core ERR", e)
          try:
              d = get(f"https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event={ev}")
              for t in d.get("injuries") or []:
                  print("summary injuries", t.get("team", {}).get("abbreviation"), [(i["athlete"]["displayName"], i.get("status"), i.get("date")) for i in t.get("injuries", []) if i.get("status") in ("Out", "Inactive", "Doubtful", "Questionable")])
              bx = (d.get("boxscore") or {}).get("players")
              print("boxscore players present:", bool(bx))
          except Exception as e: print("summary ERR", e)
          PY
