name: probe-injuries
on:
  push:
    branches: [probe-injuries]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tools && python3 - <<'PY'
          import json,auto
          sb=auto.espn_json("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=7&dates=2026")
          for ev in sb["events"]:
              h=[x for x in ev["competitions"][0]["competitors"] if x["homeAway"]=="home"][0]["team"]["abbreviation"]
              if h not in ("NYJ","ARI","LV","HOU"):continue
              k=auto.ms(ev["date"])
              print(ev["shortName"],json.dumps(auto.espn_outs(ev["id"],k)))
          PY
